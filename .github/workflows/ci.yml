name: GSVAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m compileall -q backend

      - name: Run NDR system notification tests
        working-directory: backend
        env:
          GROQ_API_KEY: "ci-test-key"
        run: |
          python -m unittest discover \
            -s . \
            -p "test_ndr_system_notification.py" \
            -v

      - name: Run AI runtime configuration tests
        working-directory: backend
        env:
          GROQ_API_KEY: "ci-test-key"
          GROQ_MODEL: "openai/gpt-oss-20b"
        run: |
          python -m unittest \
            test_ai_runtime_config.py \
            -v

      - name: Run AI security controls
        working-directory: backend
        env:
          GROQ_API_KEY: "ci-test-key"
          GROQ_MODEL: "openai/gpt-oss-20b"
        run: |
          python test_security_controls_1_4_8.py


      - name: Run invoice API tests
        working-directory: backend
        env:
          GROQ_API_KEY: "ci-test-key"
          GROQ_MODEL: "openai/gpt-oss-20b"
        run: |
          python test_invoice_endpoints.py

      - name: Build Docker image
        run: |
          docker build \
            -t gsvai-backend:ci \
            -f backend/Dockerfile \
            .
